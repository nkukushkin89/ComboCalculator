<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T2 · Акция Комбо · Регионы</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#2a2a30;color:#fff;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
:root{
  --t2-bg:#2a2a30;--t2-card:#35353c;--t2-card-hover:#3d3d45;--t2-card-soft:#2f2f36;
  --t2-border:#44444c;--t2-border-soft:#3a3a42;--t2-text:#ffffff;--t2-text-sub:#d0d0d5;
  --t2-muted:#9a9aa2;--t2-pink:#ff0080;--t2-pink-light:#ff4da6;--t2-pink-soft:rgba(255,0,128,.12);
  --t2-pink-glow:rgba(255,0,128,.35);--t2-pink-border:rgba(255,0,128,.35);
  --benefit-pos:#00d97e;--benefit-neg:#ff4757;
}
.header{position:sticky;top:0;z-index:100;background:rgba(34,34,42,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--t2-border);box-shadow:0 2px 12px rgba(0,0,0,.3);padding:14px 28px;display:flex;align-items:center;gap:24px}
.header__brand{display:flex;align-items:center;gap:14px;flex-shrink:0}
.logo-t2{display:flex;align-items:center;gap:16px;text-decoration:none}
.logo-t2__mark{width:54px;height:54px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;background:transparent}
.logo-t2__mark::before{content:'';position:absolute;top:4px;left:2px;width:14px;height:14px;background:var(--t2-pink);border-radius:3px;box-shadow:0 0 16px var(--t2-pink-glow)}
.logo-t2__mark span{color:#fff;font-weight:900;font-size:34px;font-style:italic;letter-spacing:-2.5px;position:relative;z-index:1;text-shadow:2px 3px 0px rgba(0,0,0,0.9),0px 6px 12px rgba(0,0,0,0.6);background:linear-gradient(180deg,#ffffff 0%,#c0c0c5 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-t2__text{display:flex;flex-direction:column;line-height:1.15;margin-top:2px}
.logo-t2__title{font-size:18px;font-weight:900;color:#fff}
.logo-t2__sub{font-size:12px;color:var(--t2-muted);font-weight:600}
.header__nav{display:flex;gap:4px;background:#1c1c22;padding:5px;border-radius:12px;border:1px solid var(--t2-border);margin-left:20px}
.nav-btn{padding:10px 24px;border:none;border-radius:9px;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;background:transparent;color:var(--t2-muted);transition:all .18s;display:flex;align-items:center;gap:6px}
.nav-btn.active{background:var(--t2-pink);color:#fff;box-shadow:0 4px 16px var(--t2-pink-glow)}
.date-badge{background:rgba(255,255,255,.2);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.3px}
.nav-btn.active .date-badge{background:rgba(0,0,0,.2)}
.header__spacer{flex:1}
.header__back{display:none;padding:8px 16px;border:1px solid var(--t2-border);border-radius:9px;background:transparent;color:var(--t2-muted);cursor:pointer;font-weight:700;font-family:inherit;transition:all .18s}
.header__back:hover{border-color:var(--t2-pink);color:#fff}
.view{display:none}
.view.active{display:block}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 80px);padding:40px 20px;text-align:center}
.loading-spinner{width:48px;height:48px;border:4px solid var(--t2-border);border-top-color:var(--t2-pink);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-title{font-size:24px;font-weight:900;margin-bottom:8px}
.loading-sub{font-size:14px;color:var(--t2-muted)}
.region-hero{max-width:1400px;margin:0 auto;padding:48px 28px 24px;text-align:center}
.region-hero__title{font-size:32px;font-weight:900;margin-bottom:8px}
.region-hero__title span{color:var(--t2-pink)}
.region-hero__sub{font-size:15px;color:var(--t2-muted)}
.region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;max-width:1400px;margin:0 auto;padding:0 28px 80px}
.region-card{background:var(--t2-card);border:1px solid var(--t2-border);border-radius:16px;padding:20px 22px;cursor:pointer;transition:all .22s;position:relative;overflow:hidden}
.region-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 0%,var(--t2-pink-glow) 100%);opacity:0;transition:opacity .22s;pointer-events:none}
.region-card:hover{border-color:var(--t2-pink);transform:translateY(-3px);box-shadow:0 12px 32px rgba(255,0,128,.25)}
.region-card:hover::before{opacity:.15}
.region-card__header{display:flex;align-items:center;gap:12px;margin-bottom:10px;position:relative}
.region-card__emoji{font-size:32px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3))}
.region-card__name{font-size:20px;font-weight:900;color:#fff}
.region-card__total{font-size:13px;color:var(--t2-muted);margin-bottom:14px;position:relative}
.region-card__total b{color:#fff;font-size:18px;font-weight:900}
.region-card__discounts{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.discount-chip{display:flex;flex-direction:column;align-items:center;padding:8px 14px;border-radius:10px;border:1px solid var(--t2-border);background:var(--t2-card-soft);min-width:70px}
.discount-chip__label{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--t2-muted);font-weight:700;margin-bottom:2px}
.discount-chip__value{font-size:18px;font-weight:900;color:#fff}
.discount-chip--30{border-color:rgba(255,0,128,.4)}
.discount-chip--30 .discount-chip__value{color:var(--t2-pink)}
.discount-chip--35{border-color:rgba(255,0,128,.4)}
.discount-chip--35 .discount-chip__value{color:var(--t2-pink)}
.discount-chip--20{border-color:rgba(37,99,235,.4)}
.discount-chip--20 .discount-chip__value{color:#60a5fa}
.discount-chip--25{border-color:rgba(5,150,105,.4)}
.discount-chip--25 .discount-chip__value{color:var(--benefit-pos)}
.discount-chip--15{border-color:rgba(249,115,22,.4)}
.discount-chip--15 .discount-chip__value{color:#fb923c}
.discount-chip.hidden{display:none}
.controls-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px 28px;background:rgba(34,34,42,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--t2-border);position:sticky;top:82px;z-index:95;height:280px}
.control-panel{background:var(--t2-card);border:1px solid var(--t2-border);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;height:100%;overflow:hidden}
.control-panel__title{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--t2-muted);font-weight:800;border-bottom:1px solid var(--t2-border-soft);padding-bottom:8px;flex-shrink:0;display:flex;justify-content:space-between}
.control-panel__title span{color:var(--t2-pink-light);text-transform:none;letter-spacing:0}
.tt-list{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;padding-right:4px}
.tt-list::-webkit-scrollbar{width:6px}
.tt-list::-webkit-scrollbar-track{background:var(--t2-card-soft);border-radius:3px}
.tt-list::-webkit-scrollbar-thumb{background:var(--t2-pink);border-radius:3px}
.tt-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--t2-muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;text-align:left;flex-shrink:0}
.tt-item:hover{background:rgba(255,255,255,.04);color:#fff}
.tt-item.active{background:var(--t2-pink-soft);border-color:var(--t2-pink-border);color:#fff;box-shadow:inset 3px 0 0 var(--t2-pink)}
.tt-item__count{font-size:10px;font-weight:800;background:rgba(255,255,255,.1);color:var(--t2-muted);padding:2px 6px;border-radius:5px;flex-shrink:0}
.tt-item.active .tt-item__count{background:var(--t2-pink);color:#fff}
.addon-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:6px;flex:1}
.addon-chip{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:8px;border:1px solid var(--t2-border);border-radius:10px;background:var(--t2-card-soft);color:var(--t2-muted);cursor:pointer;transition:all .18s;font-family:inherit;text-align:center}
.addon-chip:hover{border-color:var(--t2-pink);color:#fff}
.addon-chip.active{background:var(--t2-pink);border-color:var(--t2-pink);color:#fff;box-shadow:0 4px 14px var(--t2-pink-glow)}
.addon-chip__name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.addon-chip__meta{font-size:10px;font-weight:800;opacity:.8}
.addon-chip.active .addon-chip__meta{opacity:.9}
.desc-panel{background:linear-gradient(135deg,rgba(255,0,128,0.08) 0%,rgba(53,53,60,1) 100%);border:1px solid var(--t2-pink-border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;height:100%;overflow-y:auto}
.desc-panel::-webkit-scrollbar{width:6px}
.desc-panel::-webkit-scrollbar-track{background:rgba(0,0,0,0.1);border-radius:3px}
.desc-panel::-webkit-scrollbar-thumb{background:var(--t2-pink);border-radius:3px}
.desc-title{font-size:15px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}
.desc-title span{background:var(--t2-pink);color:#fff;font-size:11px;font-weight:900;padding:2px 8px;border-radius:6px}
.desc-text{font-size:13px;color:var(--t2-text-sub);line-height:1.5}
.desc-features{margin-top:4px;display:flex;flex-direction:column;gap:4px}
.desc-features li{font-size:12px;color:var(--t2-muted);list-style:none;padding-left:14px;position:relative}
.desc-features li::before{content:'✓';position:absolute;left:0;color:var(--benefit-pos);font-weight:900}
.kpi-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 28px;background:rgba(34,34,42,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--t2-border)}
.kpi-card{background:var(--t2-card);border:1px solid var(--t2-border);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--t2-muted);font-weight:700}
.kpi-value{font-size:24px;font-weight:900;color:#fff;line-height:1.15}
.kpi-value--pink{color:var(--t2-pink)}
.kpi-value--address{font-size:12px;font-weight:700;line-height:1.3;color:var(--t2-pink)}
.content{max-width:1920px;margin:0 auto;padding:24px 28px 80px}
.combo-section{margin-bottom:32px}
.combo-section__header{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.combo-section__title{font-size:18px;font-weight:900;color:#fff}
.combo-section__badge{font-size:12px;font-weight:900;padding:4px 12px;border-radius:999px;background:var(--t2-pink);color:#fff;box-shadow:0 4px 14px var(--t2-pink-glow)}
.combo-section__count{font-size:13px;color:var(--t2-muted);font-weight:600}

/* ТАБЛИЦА (ДЕСКТОП) */
.table-wrap{background:var(--t2-card);border:1px solid var(--t2-border);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.stock-table{width:100%;border-collapse:collapse}
.stock-table th{text-align:left;padding:12px 16px;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--t2-muted);font-weight:800;background:#2c2c33;border-bottom:1px solid var(--t2-border);white-space:nowrap}
.stock-table td{padding:12px 16px;border-bottom:1px solid var(--t2-border-soft);vertical-align:middle;font-size:13px;color:var(--t2-text-sub)}
.stock-table tr:last-child td{border-bottom:none}
.stock-row{cursor:pointer;transition:background .14s}
.stock-row:hover{background:var(--t2-card-hover)}
.stock-row.selected{background:var(--t2-pink-soft);box-shadow:inset 3px 0 0 var(--t2-pink)}
.stock-row__name{font-weight:700;color:#fff;font-size:14px}
.stock-row__memory{font-size:11px;color:var(--t2-muted);margin-top:2px}
.stock-row__qty{text-align:center;font-weight:800;font-size:16px;color:#fff}
.stock-row__qty--low{color:var(--benefit-neg)}
.stock-row__price{text-align:center;font-weight:700;color:#fff;white-space:nowrap}
.stock-row__colors{display:flex;align-items:center;gap:4px;justify-content:center;flex-wrap:wrap}
.color-dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,.25);flex-shrink:0}
.color-dot--silver{background:#c0c0c0}
.color-dot--purple{background:#7c3aed}
.color-dot--blue{background:#2563eb}
.color-dot--gray{background:#4b5563}
.color-dot--green{background:#059669}
.color-dot--black{background:#1a1a1a;border-color:#666}
.color-dot--white{background:#fff;border-color:#fff}
.color-dot--titanium{background:#8b8b8b}
.color-dot--gold{background:#d4a017}
.color-dot--orange{background:#f97316}
.color-dot--beige{background:#d4c4a8}
.color-dot--brown{background:#8b5a2b}
.color-dot--violet{background:#8a2be2}
.color-dot--graphite{background:#383838}
.color-dot--other{background:#888}
.color-count{font-size:10px;color:var(--t2-muted);font-weight:800;margin-left:2px}
.benefit-cell{text-align:center;white-space:nowrap}
.benefit-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;font-weight:900;font-size:12px}
.benefit-pill--pos{background:rgba(0,217,126,.15);border:1px solid var(--benefit-pos);color:var(--benefit-pos);box-shadow:0 0 16px rgba(0,217,126,.4);animation:pulse-green 2.2s infinite}
.benefit-pill--neg{background:rgba(255,71,87,.12);border:1px solid var(--benefit-neg);color:var(--benefit-neg)}
.benefit-pill__sticker{background:var(--benefit-pos);color:#000;font-size:9px;font-weight:900;padding:2px 6px;border-radius:5px;letter-spacing:.5px;text-transform:uppercase}
@keyframes pulse-green{0%,100%{box-shadow:0 0 16px rgba(0,217,126,.4)}50%{box-shadow:0 0 28px rgba(0,217,126,.65)}}
.stock-row__btn{display:inline-block;padding:5px 12px;border-radius:8px;background:transparent;border:1px solid var(--t2-pink-border);color:var(--t2-pink-light);font-size:11px;font-weight:800;cursor:pointer;transition:all .15s;font-family:inherit}
.stock-row__btn:hover{background:var(--t2-pink);color:#fff;border-color:var(--t2-pink)}

/* ПРЕЗЕНТАЦИЯ */
.pres-hero{background:linear-gradient(135deg,#2f2f36 0%,#3a1f30 100%);border:1px solid var(--t2-pink-border);border-radius:20px;padding:36px 40px;margin-bottom:36px;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(255,0,128,.12)}
.pres-hero::before{content:'';position:absolute;top:-50%;right:-10%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,var(--t2-pink-glow) 0%,transparent 70%);pointer-events:none}
.pres-hero__title{font-size:36px;font-weight:900;color:#fff;line-height:1.1;margin-bottom:8px;position:relative}
.pres-hero__title span{color:var(--t2-pink)}
.pres-hero__sub{font-size:16px;color:var(--t2-muted);position:relative;margin-bottom:20px}
.pres-hero__formula{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(0,0,0,.3);padding:12px 20px;border-radius:12px;border:1px solid var(--t2-pink-border);position:relative;font-size:14px;font-weight:600;color:#fff}
.pres-hero__formula b{color:var(--t2-pink-light)}
.pres-hero__formula .plus{color:var(--t2-muted);font-weight:400}
.discount-section{margin-bottom:48px}
.discount-section__header{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:28px;text-align:center}
.discount-section__badge{font-size:48px;font-weight:900;padding:14px 40px;border-radius:22px;background:var(--t2-pink);color:#fff;box-shadow:0 10px 40px var(--t2-pink-glow);line-height:1;letter-spacing:-1px}
.discount-section__title{font-size:24px;font-weight:900;color:#fff}
.discount-section__count{font-size:14px;color:var(--t2-muted);font-weight:600}
.pres-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.pres-card{width:200px;flex-shrink:0;background:var(--t2-card);border:1px solid var(--t2-border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .22s;position:relative;overflow:hidden}
.pres-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 0%,var(--t2-pink-glow) 100%);opacity:0;transition:opacity .22s;pointer-events:none}
.pres-card:hover{border-color:var(--t2-pink);transform:translateY(-4px);box-shadow:0 12px 32px rgba(255,0,128,.25)}
.pres-card:hover::before{opacity:.2}
.pres-card__brand{font-size:11px;font-weight:800;color:var(--t2-pink-light);text-transform:uppercase;letter-spacing:1px;position:relative}
.pres-card__name{font-size:15px;font-weight:800;color:#fff;margin:6px 0 2px;position:relative}
.pres-card__memory{font-size:12px;color:var(--t2-muted);position:relative}
.pres-card__price{font-size:18px;font-weight:900;color:#fff;margin-top:12px;position:relative}
.pres-card__price-old{font-size:12px;color:var(--t2-muted);position:relative;margin-top:2px}
.pres-card__price-old b{color:var(--benefit-pos);font-weight:800}

/* DETAIL PANEL */
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;visibility:hidden;transition:all .25s;z-index:198}
.detail-overlay.open{opacity:1;visibility:visible}
.detail-panel{position:fixed;top:0;right:-560px;width:540px;max-width:100vw;height:100vh;background:#2a2a30;border-left:1px solid var(--t2-pink-border);box-shadow:-20px 0 60px rgba(0,0,0,.5);transition:right .3s cubic-bezier(.4,0,.2,1);z-index:199;overflow-y:auto;display:flex;flex-direction:column}
.detail-panel.open{right:0}
.detail-panel__header{padding:22px 26px 18px;border-bottom:1px solid var(--t2-border);position:sticky;top:0;background:#2a2a30;z-index:2}
.detail-panel__close{position:absolute;top:18px;right:18px;width:34px;height:34px;border:1px solid var(--t2-border);background:#3a3a42;border-radius:9px;font-size:17px;cursor:pointer;color:var(--t2-muted);display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit}
.detail-panel__close:hover{background:var(--t2-pink);color:#fff;border-color:var(--t2-pink)}
.detail-panel__title{font-size:18px;font-weight:800;color:#fff;padding-right:44px;margin-bottom:8px}
.detail-panel__badge{display:inline-block;font-size:11px;font-weight:900;padding:4px 12px;border-radius:999px;background:var(--t2-pink);color:#fff}
.detail-panel__body{padding:20px 26px 30px;flex:1}
.specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.spec-item{display:flex;flex-direction:column;background:var(--t2-card);border:1px solid var(--t2-border);border-radius:10px;padding:10px 12px}
.spec-item__label{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--t2-muted);font-weight:800;margin-bottom:3px}
.spec-item__value{font-size:12px;font-weight:600;color:#fff}
.spec-item--full{grid-column:1/-1}
.highlight-box{display:flex;align-items:flex-start;gap:10px;background:rgba(255,0,128,.1);border:1px solid var(--t2-pink-border);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:13px;color:#fff}
.highlight-box__icon{color:var(--t2-pink);font-size:16px;flex-shrink:0;line-height:1.3}
.sell-script{background:linear-gradient(135deg,rgba(255,0,128,.12) 0%,rgba(255,0,128,.05) 100%);border:1px solid var(--t2-pink-border);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.sell-script__header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sell-script__icon{font-size:16px}
.sell-script__title{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:var(--t2-pink-light)}
.sell-script__text{font-size:13px;line-height:1.6;color:#fff}
.calc-box{border:1px solid var(--t2-border);border-radius:14px;overflow:hidden;margin-bottom:16px;background:var(--t2-card-soft)}
.calc-box__title{background:#2c2c33;padding:10px 16px;font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:var(--t2-muted);border-bottom:1px solid var(--t2-border)}
.calc-row{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid var(--t2-border-soft);font-size:13px;background:var(--t2-card)}
.calc-row:last-child{border-bottom:none}
.calc-row__label{color:var(--t2-muted)}
.calc-row__value{font-weight:700;color:#fff}
.calc-row--total{background:var(--t2-card-soft);border-top:1px solid var(--t2-border)}
.calc-row--total .calc-row__label{font-weight:800;color:#fff}
.calc-row--total .calc-row__value{font-size:16px;font-weight:900}
.calc-benefit{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,217,126,.12);border-top:1px solid var(--t2-border)}
.calc-benefit--neg{background:rgba(255,71,87,.12)}
.calc-benefit__label{font-size:13px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}
.calc-benefit__sticker{background:var(--benefit-pos);color:#000;font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px;letter-spacing:.5px;text-transform:uppercase}
.calc-benefit__value{font-size:20px;font-weight:900;color:var(--benefit-pos)}
.calc-benefit--neg .calc-benefit__value{color:var(--benefit-neg)}
.formula-note{font-size:11px;color:var(--t2-muted);padding:12px 16px;background:var(--t2-card-soft);border:1px solid var(--t2-border);border-radius:10px;line-height:1.6}
.empty-state{text-align:center;padding:60px 20px;color:var(--t2-muted);font-size:15px}
.debug-panel{background:#1c1c22;border:1px solid #ff4757;border-radius:12px;padding:20px;margin:20px auto;max-width:1000px;text-align:left;overflow:auto;color:#d0d0d5}
.debug-panel table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.debug-panel th,.debug-panel td{border:1px solid #44444c;padding:6px 10px;text-align:left;white-space:nowrap}
.debug-panel th{background:#2a2a30;color:#fff}

/* ============================================================
   МОБИЛЬНАЯ АДАПТАЦИЯ (КАРТОЧКИ ВМЕСТО ТАБЛИЦ)
   ============================================================ */
@media(max-width:1100px){
  .controls-grid{grid-template-columns:1fr 1fr;height:auto}
  .desc-panel{grid-column:1/-1;height:200px}
  .kpi-bar{grid-template-columns:repeat(2,1fr)}
  .detail-panel{width:100%;right:-100%}
  .pres-hero__title{font-size:26px}
  .discount-section__badge{font-size:36px;padding:12px 30px}
  .pres-card{width:180px}
}
@media(max-width:800px){
  .controls-grid{grid-template-columns:1fr;height:auto;position:static}
  .control-panel{height:auto}
  .tt-list{flex-direction:row;flex-wrap:wrap;max-height:150px;overflow-x:auto;padding-bottom:8px}
  .tt-item{white-space:nowrap}
  .region-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
}
@media(max-width:768px){
  .header{padding:10px 14px;gap:10px;flex-wrap:wrap}
  .header__nav{padding:3px;margin-left:0;width:100%;justify-content:center}
  .nav-btn{padding:8px 12px;font-size:12px;flex:1;justify-content:center}
  .header__back{display:none !important}
  .content{padding:16px 14px 60px}
  .pres-hero{padding:24px 20px}
  .pres-hero__title{font-size:22px}
  .discount-section__badge{font-size:32px;padding:10px 24px}
  .discount-section__title{font-size:18px}
  .pres-card{width:100%;max-width:260px}

  /* ПРЕВРАЩАЕМ ТАБЛИЦУ В КАРТОЧКИ */
  .table-wrap{background:transparent;border:none;box-shadow:none}
  .stock-table, .stock-table tbody, .stock-table tr, .stock-table td {display:block;width:100%}
  .stock-table thead{display:none}
  
  .stock-row {
    background:var(--t2-card); 
    border:1px solid var(--t2-border); 
    border-radius:14px; 
    margin-bottom:12px; 
    padding:14px; 
    display:grid; 
    grid-template-columns: 1fr auto; 
    grid-template-areas: 
      "name benefit" 
      "colors colors"
      "meta meta" 
      "price price" 
      "btn btn"; 
    gap:8px 12px;
    position:relative;
  }
  .stock-row:hover{background:var(--t2-card-hover)}
  .stock-row.selected{background:var(--t2-pink-soft);border-color:var(--t2-pink)}
  
  /* 1. Название */
  .stock-row td:nth-child(1) {grid-area: name; border:none; padding:0}
  /* 2. Цвета */
  .stock-row td:nth-child(2) {grid-area: colors; border:none; padding:4px 0; display:flex; justify-content:flex-start; border-top:1px dashed rgba(255,255,255,0.1); border-bottom:1px dashed rgba(255,255,255,0.1);}
  .color-dot{width:14px; height:14px;} /* Чуть крупнее для пальцев */
  /* 3. Количество */
  .stock-row td:nth-child(3) {grid-area: meta; border:none; padding:0; display:none} /* скрываем стандартный вывод */
  /* 4. Цена */
  .stock-row td:nth-child(4) {grid-area: price; border:none; padding:0; font-size:16px; font-weight:900; color:#fff}
  /* 5. Выгода */
  .stock-row td:nth-child(5) {grid-area: benefit; border:none; padding:0; text-align:right; display:flex; justify-content:flex-end; align-items:flex-start;}
  /* 6. Кнопка */
  .stock-row td:nth-child(6) {grid-area: btn; border:none; padding:0; margin-top:8px; text-align:center}
  
  .stock-row__name{font-size:15px; margin-bottom:2px}
  .stock-row__memory{display:inline-block; background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px; margin-left:6px; font-size:11px; vertical-align:middle}
  .stock-row__price{text-align:left}
  .stock-row__btn{width:100%; padding:10px; font-size:13px; background:rgba(255,0,128,0.1); border:1px solid var(--t2-pink)}
  
  /* Стили для выгоды */
  .benefit-pill{font-size:11px; padding:4px 8px; display:flex; flex-direction:column; align-items:flex-end;}
  .benefit-pill::before {font-size:9px; font-weight:normal; opacity:0.8; margin-bottom:2px}
  .benefit-pill--pos::before {content: "Выгода"}
  .benefit-pill--neg::before {content: "Доплата"}
  
  /* Добавляем количество в строку с ценой */
  .mobile-qty-label {
    font-size: 12px;
    color: var(--t2-muted);
    margin-top: 4px;
    display: block;
  }
}
</style>

function normalizeRegionName(rawName) {
  const mapping = {
    'Барнаул': 'Барнаул', 'Брянский': 'Брянск', 'Бурятский': 'Бурятия', 'Бурятия': 'Бурятия',

    'Курский': 'Курск', 'Москва': 'Москва', 'Новосибирск': 'Новосибирск', 'Саратовский': 'Саратов',
    'Томск Т2': 'Томск Т2', 'Тула': 'Тула', 'Хакасия': 'Хакасия', 'Ярославский': 'Ярославль'
  };
  return mapping[rawName] || rawName;
}

function parseExcelData(json) {
  const regions = {};
  let currentRegion = null;
  let currentShop = null;
  
  json.forEach(row => {
    if (!row || row.length === 0) return;
    const colA = String(row[1] || '').trim(); 
    const colB = String(row[2] || '').trim();
    const colC = String(row[3] || '').trim();
    
    if (!colA) return;
    if (colA === 'Склад.Филиал' || colA === 'Склад' || colA === 'Номенклатура' || colA === 'Итог') return;
    
    if (colA && !colA.includes(',') && !colA.includes('Салон') && !colA.includes('Склад') && colA.length < 40) {
      const normalized = normalizeRegionName(colA);
      currentRegion = normalized;
      if (!regions[currentRegion]) {
        const meta = REGION_META[currentRegion] || { emoji: '📍', sim3: 2400, sim12: 9150 };
        regions[currentRegion] = { rawName: colA, emoji: meta.emoji, sim3: meta.sim3, sim12: meta.sim12, points: [], stock: {} };
      }
      currentShop = null;
      return;
    }
    
    if (colA.includes('Салон') || colA.includes('Склад') || colA.includes('Теле2')) {
      if (colA.includes('Старт') || colA.includes('Подтоварка')) return;
      if (currentRegion) {
        currentShop = colA;
        if (!regions[currentRegion].points.includes(currentShop)) regions[currentRegion].points.push(currentShop);
      }
      return;
    }
    
    if (colA.startsWith('Смартфон') && currentRegion && currentShop) {
      const cleaned = colA.replace(/^Смартфон\s+/, '');
      const match = cleaned.match(/^(.+?)\s+(\d{4})\s+(\d+Gb\/\d+Gb)\s+\d+G\s+(.+?)(?:\s+!)?$/);
      if (match) {
        const fullName = match[1].trim();
        const memory = match[3].replace(/Gb/g, '');
        const spaceIdx = fullName.indexOf(' ');
        const brand = spaceIdx > 0 ? fullName.substring(0, spaceIdx) : fullName;
        const model = spaceIdx > 0 ? fullName.substring(spaceIdx + 1) : '';
        const price = parseFloat(colC) || 0;
        const qty = parseFloat(colB) || 0;
        
        if (qty > 0) {
          const key = `${brand} ${model}|${memory}`;
          if (!regions[currentRegion].stock[currentShop]) regions[currentRegion].stock[currentShop] = {};
          if (!regions[currentRegion].stock[currentShop][key]) {
            regions[currentRegion].stock[currentShop][key] = { brand, model, memory, price, qty: 0, colors: {} };
          }
          regions[currentRegion].stock[currentShop][key].qty += qty;
          
          const colorStr = (match[4] || '').toLowerCase();
          let colorCode = 'other';
          if (colorStr.includes('black') || colorStr.includes('черный') || colorStr.includes('чёрный')) colorCode = 'black';
          else if (colorStr.includes('white') || colorStr.includes('белый')) colorCode = 'white';
          else if (colorStr.includes('blue') || colorStr.includes('синий') || colorStr.includes('голубой')) colorCode = 'blue';
          else if (colorStr.includes('gray') || colorStr.includes('серый') || colorStr.includes('grey')) colorCode = 'gray';
          else if (colorStr.includes('purple') || colorStr.includes('фиолетовый') || colorStr.includes('сиреневый')) colorCode = 'purple';
          else if (colorStr.includes('green') || colorStr.includes('зеленый') || colorStr.includes('зелёный')) colorCode = 'green';
          else if (colorStr.includes('silver') || colorStr.includes('серебристый')) colorCode = 'silver';
          else if (colorStr.includes('titanium') || colorStr.includes('титановый')) colorCode = 'titanium';
          else if (colorStr.includes('gold') || colorStr.includes('золотой')) colorCode = 'gold';
          else if (colorStr.includes('orange') || colorStr.includes('оранжевый')) colorCode = 'orange';
          else if (colorStr.includes('beige') || colorStr.includes('бежевый')) colorCode = 'beige';
          else if (colorStr.includes('brown') || colorStr.includes('коричневый')) colorCode = 'brown';
          else if (colorStr.includes('violet')) colorCode = 'violet';
          else if (colorStr.includes('graphite') || colorStr.includes('графит')) colorCode = 'graphite';
          
          regions[currentRegion].stock[currentShop][key].colors[colorCode] = (regions[currentRegion].stock[currentShop][key].colors[colorCode] || 0) + qty;
        }
      }
    }
  });
  return regions;
}

function loadFromGoogleSheets() {
  window.handleGVizData = function(gvizResponse) {
    try {
      if (gvizResponse.status === 'error') {
        console.error('GViz error:', gvizResponse.errors);
        throw new Error('Ошибка Google: ' + (gvizResponse.errors?.[0]?.detailed_message || 'access_denied'));
      }

      const table = gvizResponse.table;
      const rows = [];

      if (table.cols) {
        rows.push(table.cols.map(col => col.label || ''));
      }

      if (table.rows) {
        table.rows.forEach(row => {
          const rowData = row.c.map(cell => {
            if (!cell) return '';
            return cell.v !== null && cell.v !== undefined ? cell.v : '';
          });
          rows.push(rowData);
        });
      }

      REGIONS_DATA = parseExcelData(rows);

      if (Object.keys(REGIONS_DATA).length === 0) {
        showDebug(rows);
        return;
      }

      document.getElementById('view-loading').classList.remove('active');
      document.getElementById('view-regions').classList.add('active');
      renderRegions();

    } catch (err) {
      console.error('Ошибка парсинга GViz данных:', err);
      showError('Не удалось разобрать данные из Google Таблицы. ' + err.message);
    }
  };

  const script = document.createElement('script');

function determineDiscount(brand, modelName, price) {
  if (brand === 'Tecno' && modelName.includes('Camon 50') && !modelName.includes('Ultra')) return 0.35;
  if (brand === 'Tecno' && modelName.includes('Pova 8')) return 0.30;
  if (brand === 'Apple') return 0.15;
  if (brand === 'Infinix') return 0.30;
  const realmeCoreModels = ['C100i', 'C100x', 'C85', 'C85 Pro'];
  if (brand === 'Realme' && realmeCoreModels.some(m => modelName.includes(m))) return 0.30;
  const samsungCombo30 = ['Galaxy A27'];
  if (brand === 'Samsung' && samsungCombo30.some(m => modelName.includes(m))) return 0.30;
  return price > 15000 ? 0.20 : 0.25;
}

function calcCombo(price, discount, addonId, isApple, regionData) {
  const sim3Price = regionData.sim3;
  const sim12Price = regionData.sim12;
  let sim, simName;
  if (isApple) { sim = sim12Price; simName = 'SIM t2 Мой Онлайн+ 12мес КОМБО'; }
  else { sim = sim3Price; simName = 'SIM t2 Мой Онлайн+ 3мес КОМБО'; }
  let addon = ADDONS.find(a => a.id === addonId) || ADDONS[0];

  const cyberBlocked = addon.id.includes('cyber') && (isApple || price >= 40000);

  if (cyberBlocked) {
    return {
      phoneCombo: price, sim, simName,
      addon: 0,
      addonName: isApple ? 'КиберЗащита недоступна' : 'КиберЗащита недоступна (цена ≥ 40 000 ₽)',
      total: price + sim,
      benefit: -sim,
      noDiscount: true
    };
  }

  let addonPrice = addon.type === 'fixed'
    ? (addon.id === 'cyber12' && price >= 25000 ? 4990 : addon.price)
    : Math.round(price * addon.percent);
  const phoneCombo = Math.round(price * (1 - discount));
  const total = phoneCombo + sim + addonPrice;
  return { phoneCombo, sim, simName, addon: addonPrice, addonName: addon.name, total, benefit: price - total, noDiscount: false };
}

function renderContent(){
  const content = document.getElementById('content');
  if (!currentRegionData) { content.innerHTML = `<div class="empty-state">Сначала выберите регион</div>`; return; }
  const items = currentRegionData.stock[activeTT] ? Object.values(currentRegionData.stock[activeTT]) : [];
  if (items.length === 0){ content.innerHTML = `<div class="empty-state">Нет остатков по точке «${activeTT}»</div>`; return; }
  const groups = {};
  items.forEach(it => {
    const disc = determineDiscount(it.brand, it.model, it.price);
    const badge = Math.round(disc * 100) + '%';
    if (!groups[disc]) groups[disc] = { title: `Комбо ${badge}`, badge: badge, items: [] };
    groups[disc].items.push(it);
  });
  const sortedKeys = Object.keys(groups).map(Number).sort((a, b) => b - a);
  let html = '';
  sortedKeys.forEach(disc => {
    const grp = groups[disc];
    grp.items.sort((a,b) => a.brand.localeCompare(b.brand) || a.model.localeCompare(b.model) || a.memory.localeCompare(b.memory));
    const totalQty = grp.items.reduce((s, it) => s + it.qty, 0);
    const rows = grp.items.map(it => {
      const specKey = `${it.brand} ${it.model}|${it.memory}`;
      const colorEntries = Object.entries(it.colors).sort((a,b) => b[1] - a[1]);
      const colorDots = colorEntries.map(([color, qty]) => `<span class="color-dot color-dot--${color}" title="${color}: ${qty}"></span>`).join('');
      const combo = calcCombo(it.price, disc, activeAddon, it.brand === 'Apple', currentRegionData);
      
      let benefitHtml = combo.noDiscount 
        ? `<span class="benefit-pill benefit-pill--neg" style="font-size:11px;">${it.price >= 40000 ? 'Только страховка' : 'Нужна страховка'}</span>`
        : (combo.benefit >= 0 
          ? `<span class="benefit-pill benefit-pill--pos"><span class="benefit-pill__sticker">Выгодно!</span>+${combo.benefit.toLocaleString('ru-RU')} ₽</span>`
          : `<span class="benefit-pill benefit-pill--neg">${combo.benefit.toLocaleString('ru-RU')} ₽</span>`);

      return `<tr class="stock-row" data-spec-key="${specKey}">
        <td><div class="stock-row__name">${it.brand} ${it.model}</div><div class="stock-row__memory">${it.memory}</div></td>
        <td class="stock-row__colors">${colorDots}<span class="color-count">${colorEntries.length}</span></td>
        <td class="stock-row__qty ${it.qty <= 2 ? 'stock-row__qty--low' : ''}">${it.qty}</td>
        <td class="stock-row__price">${it.price.toLocaleString('ru-RU')} ₽<span class="mobile-qty-label">В наличии: ${it.qty} шт.</span></td>
        <td class="benefit-cell">${benefitHtml}</td>
        <td style="text-align:center"><button class="stock-row__btn">Подробнее</button></td>
      </tr>`;
    }).join('');

      <div class="combo-section__header"><span class="combo-section__title">${grp.title}</span><span class="combo-section__badge">${grp.badge}</span><span class="combo-section__count">${totalQty} ед. · ${grp.items.length} моделей</span></div>

          <tbody>${rows}</tbody>
        </table>
      </div>

  });

  content.querySelectorAll('.stock-row').forEach(row => {

  });

function renderPresentation(){
  const presContent = document.getElementById('presContent');
  if (!currentRegionData) { presContent.innerHTML = `<div class="empty-state">Сначала выберите регион</div>`; return; }
  const allModelKeys = new Set();
  Object.values(currentRegionData.stock).forEach(ttItems => { Object.keys(ttItems).forEach(key => allModelKeys.add(key)); });
  const models = Array.from(allModelKeys).map(key => {
    const [nameMem, mem] = key.split('|');
    const [brand, ...modelParts] = nameMem.split(' ');
    const model = modelParts.join(' ');
    let price = 0;
    for (const shop in currentRegionData.stock) { if (currentRegionData.stock[shop][key]) { price = currentRegionData.stock[shop][key].price; break; } }
    const discount = determineDiscount(brand, model, price);
    const spec = SPECS[key] || { brand, highlight:'Характеристики уточняются' };
    return { key, brand, model, mem, price, discount, spec };
  });
  const groups = {};
  models.forEach(m => { const badge = Math.round(m.discount * 100); if (!groups[badge]) groups[badge] = []; groups[badge].push(m); });
  const sortedDiscounts = Object.keys(groups).map(Number).sort((a, b) => b - a);
  let sectionsHtml = '';
  sortedDiscounts.forEach(disc => {
    const groupModels = groups[disc];
    if (groupModels.length === 0) return;
    groupModels.sort((a,b) => a.brand.localeCompare(b.brand) || a.model.localeCompare(b.model) || a.mem.localeCompare(b.mem));
    const cards = groupModels.map(m => {
      const combo = calcCombo(m.price, m.discount, activeAddon, m.brand === 'Apple', currentRegionData);
      const priceString = combo.noDiscount ? `<span style="color:var(--benefit-neg); font-size:11px;">Только страховка</span>` : `По комбо: <b>${combo.phoneCombo.toLocaleString('ru-RU')} ₽</b>`;
      return `<div class="pres-card" data-spec-key="${m.key}">
        <div class="pres-card__brand">${m.brand}</div>
        <div class="pres-card__name">${m.model}</div>
        <div class="pres-card__memory">${m.mem}</div>
        <div class="pres-card__price">${m.price.toLocaleString('ru-RU')} ₽</div>
        <div class="pres-card__price-old">${priceString}</div>
      </div>`;
    }).join('');
    sectionsHtml += `<section class="discount-section">
      <div class="discount-section__header"><span class="discount-section__badge">−${disc}%</span><span class="discount-section__title">Комбо ${disc}%</span><span class="discount-section__count">${groupModels.length} моделей</span></div>
      <div class="pres-grid">${cards}</div>
    </section>`;
  });
  presContent.innerHTML = `
    <div class="pres-hero">
      <h1 class="pres-hero__title">Скидка на <span>смартфоны</span><br>при покупке в комбо</h1>
      <p class="pres-hero__sub">Купи смартфон + SIM t2 + любой продукт защиты — получи скидку от 15% до 35%</p>
      <div class="pres-hero__formula"><b>Смартфон</b><span class="plus">+</span><b>SIM t2 Мой Онлайн+</b><span class="plus">+</span><b>Защита</b><span class="plus">=</span><b>скидка 15% – 35%</b></div>
    </div>${sectionsHtml}`;
  presContent.querySelectorAll('.pres-card').forEach(card => {
    card.addEventListener('click', () => openDetail(card.dataset.specKey, card));
  });
}

    <div class="highlight-box"><span class="highlight-box__icon">★</span><span>${spec.highlight}</span></div>
    <div class="sell-script">
      <div class="sell-script__header"><span class="sell-script__icon">💬</span><span class="sell-script__title">Скрипт продажи</span></div>
      <div class="sell-script__text">${script}</div>
    </div>
    <div class="calc-box">
      <div class="calc-box__title">Расчёт по комбо</div>
      ${calcHtml}
    </div>
    <div class="formula-note">Механика: смартфон + SIM + продукт защиты. Скидка применяется только при наличии всех трёх позиций в чеке. Для смартфонов дороже 40 000 ₽ и Apple КиберЗащита не применяется — только страховки.</div>`;
  document.getElementById('detailPanel').classList.add('open');
  document.getElementById('detailOverlay').classList.add('open');
  document.querySelectorAll('.stock-row').forEach(r => r.classList.remove('selected'));
  if (sourceEl && sourceEl.classList.contains('stock-row')) sourceEl.classList.add('selected');
}

function closeDetail(){
  document.getElementById('detailPanel').classList.remove('open');
  document.getElementById('detailOverlay').classList.remove('open');
  document.querySelectorAll('.stock-row').forEach(r => r.classList.remove('selected'));
}

function renderAll(){ renderControls(); renderKPI(); renderContent(); }
// Автоматическая подстановка текущей даты (ДД.ММ.ГГ) в шапку
(function setDateBadge() {
  const now = new Date();
  const day = String(now.getDate()).padStart(2, '0');
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const year = String(now.getFullYear()).slice(-2); // Берем последние 2 цифры года
  document.getElementById('currentDateBadge').textContent = `${day}.${month}.${year}`;
})();

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
</script>
